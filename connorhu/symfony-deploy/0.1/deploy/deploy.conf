# Deploy konfiguráció (bash szintaxis, a scriptek source-olják).
# Titkot nem tartalmazhat: a jelszavak és kulcsok a célgépen élnek.

# --- Környezetek: <env>_KULCS ---
# A környezet neve betűvel kezdődő, kisbetűkből, számokból és _ jelből álló szó.
# Használat: bin/build prod, bin/deploy prod

prod_BRANCH=main
prod_SSH_TARGET=root@example.hu
prod_PROJECT_ROOT=/srv/app
prod_PHP=php
# A célgépen a megosztott .env.local-ban kötelezően meglévő változók.
prod_REQUIRED_ENV="APP_SECRET DATABASE_URL"

staging_BRANCH=staging
staging_SSH_TARGET=root@example.hu
staging_PROJECT_ROOT=/srv/app
staging_PHP=php
staging_REQUIRED_ENV="APP_SECRET DATABASE_URL"

# --- Minden környezetre közös ---

# A célgépen a release és a megosztott mappák tulajdonosa.
DEPLOY_OWNER=www-data

# A build gépen használt php.
BUILD_PHP=php

# A composer install --ignore-platform-req értékei (szóközzel elválasztva), pl. "ext-bcmath".
BUILD_IGNORE_PLATFORM_REQS=""

# Release-ek között megosztott mappák (a projekt gyökeréhez képest).
SHARED_PATHS="var/log"

# A build után törlendő fájlok, mappák. A deploy/ mappát NE vedd fel ide,
# mert a hookok és a célgépi taskok innen kerülnek a célgépre.
BUILD_REMOVE="node_modules tests docs README.md"
